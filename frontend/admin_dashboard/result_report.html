<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EXAMORA | Result Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0050cb", "primary-container": "#0066ff", "on-primary": "#ffffff",
                        "secondary": "#505f76", "secondary-container": "#d0e1fb",
                        "surface": "#f7f9fb", "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f2f4f6", "surface-container": "#eceef0",
                        "surface-container-high": "#e6e8ea", "surface-container-highest": "#dfe1e3",
                        "on-surface": "#191c1e", "on-surface-variant": "#424656",
                        "outline": "#727687", "outline-variant": "#c2c6d8",
                        "error": "#ba1a1a", "error-container": "#ffdad6", "on-error-container": "#93000a",
                        "success": "#16a34a", "success-container": "#dcfce7"
                    },
                    fontFamily: { "body": ["Inter", "sans-serif"] }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        @layer base { html, body { margin: 0; padding: 0; } }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-surface font-body text-on-surface">

<!-- Navigation -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-md shadow-sm border-b border-outline-variant/30">
    <div class="h-16 w-full px-8 flex items-center justify-between">
        <a href="code.html" class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white shadow-sm flex-shrink-0">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
            </div>
            <span class="font-bold text-primary text-xl tracking-tight">EXAMORA</span>
            <span class="text-on-surface-variant text-sm font-medium hidden md:inline institution-name-display"></span>
        </a>
        <div class="flex items-center gap-4">
            <a href="code.html" class="text-sm text-on-surface-variant hover:text-primary font-medium">Dashboard</a>
        </div>
    </div>
</header>

<main class="w-full pt-20 p-8 min-h-screen">
<div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
        <div>
            <h2 class="text-3xl font-black text-on-surface tracking-tight mb-1">Result Reports</h2>
            <p class="text-on-surface-variant font-medium text-sm">View, filter, and export examination results.</p>
        </div>
        <button onclick="exportCSV()" class="px-5 py-2.5 bg-primary text-on-primary rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-primary-container transition-all flex items-center gap-2 cursor-pointer shadow-md shadow-primary/20">
            <span class="material-symbols-outlined text-base">download</span>
            Export CSV
        </button>
    </div>

    <!-- Filters -->
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 shadow-sm p-5 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1.5">Search</label>
                <input type="text" id="filter-search" placeholder="Name or email..."
                       class="w-full bg-surface-container-low border border-outline-variant/40 rounded-xl px-3 py-2.5 text-xs text-on-surface focus:border-primary outline-none"/>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1.5">Grade</label>
                <select id="filter-grade" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-xl px-3 py-2.5 text-xs text-on-surface focus:border-primary outline-none">
                    <option value="">All Grades</option>
                    <option value="A+">A+</option><option value="A">A</option><option value="B">B</option>
                    <option value="C">C</option><option value="D">D</option><option value="F">F</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1.5">Status</label>
                <select id="filter-status" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-xl px-3 py-2.5 text-xs text-on-surface focus:border-primary outline-none">
                    <option value="">All</option>
                    <option value="PASSED">Passed</option>
                    <option value="FAILED">Failed</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1.5">Submission</label>
                <select id="filter-timeout" class="w-full bg-surface-container-low border border-outline-variant/40 rounded-xl px-3 py-2.5 text-xs text-on-surface focus:border-primary outline-none">
                    <option value="">All Types</option>
                    <option value="1">AUTO_TIMEOUT Only</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="loadResults(1)" class="w-full px-4 py-2.5 bg-primary/10 text-primary rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-primary/20 transition-all cursor-pointer">
                    Apply Filters
                </button>
            </div>
        </div>
    </div>

    <!-- Results Table -->
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-surface-container-low border-b border-outline-variant/30">
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Student</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Exam</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Date</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Score</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">%</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Grade</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Status</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Type</th>
                        <th class="p-4 text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Cert</th>
                    </tr>
                </thead>
                <tbody id="results-tbody" class="divide-y divide-outline-variant/20">
                    <tr><td colspan="9" class="p-8 text-center text-on-surface-variant text-sm">Loading results...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="p-4 border-t border-outline-variant/20 flex justify-between items-center">
            <span id="pagination-info" class="text-xs text-on-surface-variant font-medium">— results</span>
            <div class="flex gap-2" id="pagination-controls"></div>
        </div>
    </div>

</div>
</main>

<script src="../shared/auth.js"></script>
<script>
let currentPage = 1;

document.addEventListener('DOMContentLoaded', async () => {
    const admin = await requireAdminAuth({ redirectOnFail: true, updateUI: true });
    if (!admin) return;
    loadResults(1);
});

async function loadResults(page) {
    currentPage = page;
    const search = document.getElementById('filter-search').value.trim();
    const grade = document.getElementById('filter-grade').value;
    const status = document.getElementById('filter-status').value;
    const timeout = document.getElementById('filter-timeout').value;

    const params = new URLSearchParams({ page, per_page: 25 });
    if (search) params.set('search', search);
    if (grade) params.set('grade', grade);
    if (status) params.set('status', status);
    if (timeout) params.set('timeout', timeout);

    try {
        const resp = await fetchApi(`/api/admin/results/history?${params}`);
        const data = await resp.json();

        if (!data.success) {
            document.getElementById('results-tbody').innerHTML = '<tr><td colspan="9" class="p-8 text-center text-error text-sm">Failed to load results.</td></tr>';
            return;
        }

        renderResults(data.results, data.pagination);
    } catch (e) {
        console.error(e);
    }
}

function renderResults(results, pagination) {
    const tbody = document.getElementById('results-tbody');

    if (!results || results.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-on-surface-variant text-sm">No results found matching your filters.</td></tr>';
        document.getElementById('pagination-info').textContent = '0 results';
        document.getElementById('pagination-controls').innerHTML = '';
        return;
    }

    tbody.innerHTML = results.map(r => {
        const isPassed = r.is_passed;
        const statusBadge = isPassed
            ? '<span class="px-2 py-0.5 bg-success-container text-success rounded-lg text-[10px] font-bold uppercase">Passed</span>'
            : '<span class="px-2 py-0.5 bg-error-container text-error rounded-lg text-[10px] font-bold uppercase">Failed</span>';

        const typeBadge = r.submission_type === 'AUTO_TIMEOUT'
            ? '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-lg text-[10px] font-bold">Timeout</span>'
            : '<span class="text-[11px] text-on-surface-variant">Manual</span>';

        const certBadge = r.certificate_id
            ? `<span class="px-2 py-0.5 bg-primary/10 text-primary rounded-lg text-[10px] font-mono font-bold">${r.certificate_id}</span>`
            : '<span class="text-[11px] text-outline">—</span>';

        const date = r.exam_date ? new Date(r.exam_date).toLocaleDateString() : '—';

        return `<tr class="hover:bg-surface-container-low/50 transition-colors">
            <td class="p-4">
                <div class="text-sm font-bold text-on-surface">${r.student_name || '—'}</div>
                <div class="text-[11px] text-on-surface-variant">${r.email || ''}</div>
            </td>
            <td class="p-4">
                <div class="text-xs font-semibold text-on-surface">${r.exam_title || '—'}</div>
                <div class="text-[10px] text-outline font-mono">${r.exam_code || ''}</div>
            </td>
            <td class="p-4 text-xs text-on-surface-variant">${date}</td>
            <td class="p-4 text-xs font-bold text-on-surface">${r.score}/${r.total_marks}</td>
            <td class="p-4 text-xs font-bold text-primary">${parseFloat(r.percentage).toFixed(1)}%</td>
            <td class="p-4 text-sm font-black text-primary">${r.grade}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4">${typeBadge}</td>
            <td class="p-4">${certBadge}</td>
        </tr>`;
    }).join('');

    // Pagination
    const info = document.getElementById('pagination-info');
    info.textContent = `${pagination.total} result${pagination.total !== 1 ? 's' : ''} (Page ${pagination.page}/${pagination.total_pages})`;

    const controls = document.getElementById('pagination-controls');
    controls.innerHTML = '';

    if (pagination.page > 1) {
        const prev = document.createElement('button');
        prev.className = 'px-3 py-1.5 rounded-lg bg-surface-container-high text-on-surface text-xs font-bold hover:bg-primary/10 transition-colors cursor-pointer';
        prev.textContent = 'Previous';
        prev.onclick = () => loadResults(pagination.page - 1);
        controls.appendChild(prev);
    }
    if (pagination.page < pagination.total_pages) {
        const next = document.createElement('button');
        next.className = 'px-3 py-1.5 rounded-lg bg-primary text-on-primary text-xs font-bold hover:bg-primary-container transition-colors cursor-pointer shadow-sm';
        next.textContent = 'Next';
        next.onclick = () => loadResults(pagination.page + 1);
        controls.appendChild(next);
    }
}

function exportCSV() {
    const search = document.getElementById('filter-search').value.trim();
    const grade = document.getElementById('filter-grade').value;
    const status = document.getElementById('filter-status').value;
    const timeout = document.getElementById('filter-timeout').value;

    const params = new URLSearchParams();
    if (search) params.set('search', search);
    if (grade) params.set('grade', grade);
    if (status) params.set('status', status);
    if (timeout) params.set('timeout', timeout);

    // Direct download via browser
    const url = `${API_BASE}/api/admin/results/export?${params}`;
    const link = document.createElement('a');
    link.href = url;
    link.download = 'examora_results_export.csv';
    document.body.appendChild(link);

    // For cross-origin with credentials, use fetch
    fetchApi(`/api/admin/results/export?${params}`)
        .then(resp => resp.blob())
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'examora_results_export.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
            showToast('CSV exported successfully!', 'success');
        })
        .catch(e => {
            console.error(e);
            showToast('Export failed.', 'error');
        });

    link.remove();
}
</script>
</body>
</html>
